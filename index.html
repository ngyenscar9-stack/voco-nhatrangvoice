<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Your Nha Trang | voco Scenia Bay</title>


  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f6bb21 0%,
          #facb42 50%,
          #f3b81e 100%
        );

      color: #17233e;

      overflow: hidden;

    }



    /* =========================================================
       MAIN SCREEN
    ========================================================= */

    .screen {

      width: 100%;
      min-height: 100vh;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 40px;

    }



    /* =========================================================
       BACKGROUND DECORATION
    ========================================================= */

    .background-circle-one {

      width: 430px;
      height: 430px;

      position: absolute;

      top: -190px;
      right: -110px;

      border-radius: 50%;

      background:
        rgba(
          255,
          255,
          255,
          0.12
        );

    }


    .background-circle-two {

      width: 330px;
      height: 330px;

      position: absolute;

      bottom: -180px;
      left: -100px;

      border-radius: 50%;

      border:
        1px solid
        rgba(
          23,
          35,
          62,
          0.12
        );

    }



    /* =========================================================
       VOCO BRAND
    ========================================================= */

    .brand {

      position: absolute;

      top: 30px;
      left: 50%;

      transform:
        translateX(-50%);

      text-align: center;

      z-index: 20;

    }


    .voco {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 48px;

      font-weight: 600;

      letter-spacing: 4px;

      line-height: 1;

    }


    .by-ihg {

      margin-top: 8px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 10px;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;

    }


    .by-ihg::before,
    .by-ihg::after {

      content: "";

      width: 28px;
      height: 1px;

      background: #17233e;

    }



    /* =========================================================
       MAIN PANEL
    ========================================================= */

    .panel {

      width:
        min(
          650px,
          94vw
        );

      min-height: 550px;

      padding:
        48px
        50px;

      background:
        #fffdf8;

      border-radius: 30px;

      box-shadow:
        0
        25px
        70px
        rgba(
          0,
          0,
          0,
          0.14
        );

      position: relative;

      z-index: 10;

      text-align: center;

      display: flex;

      flex-direction: column;

      justify-content: center;

      overflow: hidden;

    }



    /* =========================================================
       COMMON TEXT
    ========================================================= */

    .eyebrow {

      margin-bottom: 13px;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #9b8250;

    }


    .title {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 38px;

      font-weight: 500;

      line-height: 1.2;

      margin-bottom: 12px;

      color: #17233e;

    }


    .subtitle {

      max-width: 460px;

      margin:
        0 auto
        30px;

      font-size: 14px;

      line-height: 1.65;

      color: #777;

    }



    /* =========================================================
       PROGRESS
    ========================================================= */

    .progress {

      width: 100%;

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-bottom: 28px;

    }


    .progress-dot {

      width: 8px;
      height: 8px;

      border-radius: 20px;

      background: #ddd8cd;

      transition:
        0.3s ease;

    }


    .progress-dot.active {

      width: 28px;

      background: #f6bb21;

    }



    /* =========================================================
       OPTIONS
    ========================================================= */

    .options {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap: 14px;

    }


    .options.moods {

      grid-template-columns:
        repeat(
          3,
          1fr
        );

    }


    .option-button {

      min-height: 84px;

      border:
        1.5px solid
        #e3ded3;

      border-radius: 17px;

      background: white;

      cursor: pointer;

      padding:
        15px
        13px;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 8px;

      color: #17233e;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;

    }


    .option-button:hover {

      transform:
        translateY(-3px);

      border-color:
        #17233e;

      box-shadow:
        0
        10px
        25px
        rgba(
          0,
          0,
          0,
          0.08
        );

    }


    .option-button.selected {

      background: #17233e;

      border-color: #17233e;

      color: white;

      transform:
        translateY(-2px);

    }


    .option-icon {

      font-size: 25px;

    }


    .option-label {

      font-size: 14px;

      font-weight: 700;

    }



    /* =========================================================
       NEXT BUTTON
    ========================================================= */

    .next-button {

      width: 100%;

      margin-top: 24px;

      padding: 17px;

      border: none;

      border-radius: 14px;

      background: #17233e;

      color: white;

      cursor: pointer;

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 1.2px;

      opacity: 0.35;

      pointer-events: none;

      transition: 0.2s ease;

    }


    .next-button.enabled {

      opacity: 1;

      pointer-events: auto;

    }



    /* =========================================================
       AI LOADING
    ========================================================= */

    .ai-loader {

      animation:
        fadeUp
        0.6s
        ease;

    }


    .ai-circle {

      width: 115px;
      height: 115px;

      margin:
        20px auto
        28px;

      border-radius: 50%;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        #f6bb21;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 28px;

      font-weight: 600;

    }


    .ai-circle::before {

      content: "";

      position: absolute;

      width: 135px;
      height: 135px;

      border-radius: 50%;

      border:
        1px solid
        #f6bb21;

      animation:
        pulse
        1.5s
        ease-in-out
        infinite;

    }


    .loading-text {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 500;

      margin-bottom: 12px;

    }


    .loading-subtitle {

      font-size: 14px;

      color: #777;

    }


    .loading-bar {

      width: 210px;
      height: 4px;

      margin:
        30px auto
        0;

      border-radius: 10px;

      background:
        #ece7dd;

      overflow: hidden;

    }


    .loading-progress {

      width: 0%;
      height: 100%;

      background:
        #f6bb21;

      animation:
        load
        2.6s
        ease
        forwards;

    }



    /* =========================================================
       POSTCARD
    ========================================================= */

    .postcard-wrapper {

      animation:
        fadeUp
        0.6s
        ease;

    }


    .postcard {

      width: 100%;

      min-height: 340px;

      border-radius: 24px;

      padding:
        37px
        40px;

      position: relative;

      overflow: hidden;

      text-align: left;

      background:

        radial-gradient(
          circle at top right,
          rgba(
            246,
            187,
            33,
            0.55
          ),
          transparent 36%
        ),

        linear-gradient(
          140deg,
          #18304d,
          #1f4962 55%,
          #4b7b83
        );

      color: white;

      box-shadow:
        0
        18px
        45px
        rgba(
          23,
          35,
          62,
          0.25
        );

    }


    .postcard-small {

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 4px;

      text-transform: uppercase;

      color:
        rgba(
          255,
          255,
          255,
          0.7
        );

      margin-bottom: 15px;

    }


    .postcard-title {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 40px;

      font-weight: 500;

      margin-bottom: 24px;

    }


    .postcard-line {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 20px;

      line-height: 1.52;

    }


    .postcard-tags {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 20px;

    }


    .tag {

      padding:
        6px
        10px;

      border-radius: 20px;

      background:
        rgba(
          255,
          255,
          255,
          0.14
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.2
        );

      font-size: 10px;

    }


    .postcard-voco {

      margin-top: 25px;

      font-size: 10px;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.7;

    }



    /* =========================================================
       POSTCARD ACTION
    ========================================================= */

    .postcard-actions {

      margin-top: 20px;

      display: flex;

      gap: 11px;

    }


    .share-button {

      flex: 1;

      padding: 16px;

      border: none;

      border-radius: 13px;

      background: #17233e;

      color: white;

      cursor: pointer;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    .restart-button {

      width: 52px;

      border-radius: 13px;

      background: white;

      color: #17233e;

      border:
        1.5px solid
        #ddd8ce;

      cursor: pointer;

      font-size: 18px;

    }



    /* =========================================================
       SHARE PLATFORM SCREEN
    ========================================================= */

    .share-screen {

      animation:
        fadeUp
        0.6s
        ease;

    }


    .share-icon {

      width: 88px;
      height: 88px;

      margin:
        10px auto
        24px;

      border-radius: 50%;

      background: #f6bb21;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 34px;

    }


    .platforms {

      display: flex;

      gap: 14px;

      margin-top: 10px;

    }


    .platform-button {

      flex: 1;

      min-height: 100px;

      border:
        1.5px solid
        #ded9cf;

      border-radius: 18px;

      background: white;

      cursor: pointer;

      font-size: 15px;

      font-weight: 700;

      color: #17233e;

      transition:
        0.2s ease;

    }


    .platform-button span {

      display: block;

      font-size: 29px;

      margin-bottom: 10px;

    }


    .platform-button:hover {

      transform:
        translateY(-4px);

      background: #17233e;

      color: white;

      border-color:
        #17233e;

      box-shadow:
        0
        12px
        28px
        rgba(
          23,
          35,
          62,
          0.15
        );

    }



    /* =========================================================
       DISCOVERY ANIMATION
    ========================================================= */

    .discovery-screen {

      width: 100%;

      animation:
        fadeUp
        0.5s
        ease;

    }


    .sharing-platform {

      display: inline-block;

      padding:
        7px
        12px;

      margin-bottom: 24px;

      border-radius: 30px;

      background:
        #f6bb21;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1.3px;

      text-transform: uppercase;

    }


    .discovery-title {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 500;

      margin-bottom: 33px;

    }


    .journey-network {

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      width: 100%;

    }


    .network-step {

      flex: 1;

      opacity: 0;

      transform:
        scale(0.6)
        translateY(20px);

    }


    .network-step.show {

      animation:
        popBounce
        0.7s
        ease
        forwards;

    }


    .network-circle {

      width: 92px;
      height: 92px;

      margin:
        0 auto
        12px;

      border-radius: 50%;

      display: flex;

      justify-content: center;
      align-items: center;

      flex-direction: column;

      background:
        #fff7dd;

      border:
        2px solid
        #f6bb21;

      box-shadow:
        0
        10px
        25px
        rgba(
          0,
          0,
          0,
          0.08
        );

    }


    .network-step.show .network-circle {

      animation:
        dance
        0.72s
        ease-in-out
        infinite;

    }


    .network-number {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 28px;

      font-weight: 600;

      line-height: 1;

    }


    .network-icon {

      font-size: 18px;

      margin-top: 4px;

    }


    .network-label {

      font-size: 11px;

      font-weight: 700;

      color: #777;

      text-transform: uppercase;

      letter-spacing: 1px;

    }


    .network-arrow {

      font-size: 23px;

      color: #c8a12d;

      opacity: 0;

    }


    .network-arrow.show {

      animation:
        arrowAppear
        0.4s
        ease
        forwards;

    }



    /* =========================================================
       FINAL DISCOVERY
    ========================================================= */

    .more-discovery {

      opacity: 0;

      margin-top: 40px;

    }


    .more-discovery.show {

      animation:
        finalReveal
        0.8s
        ease
        forwards;

    }


    .more-discovery-small {

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 4px;

      color: #9b8250;

      text-transform: uppercase;

    }


    .more-discovery-big {

      margin-top: 7px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 37px;

      font-weight: 500;

      color: #17233e;

    }


    .discovery-line {

      width: 60px;
      height: 3px;

      margin:
        18px auto
        0;

      background: #f6bb21;

      border-radius: 10px;

    }



    /* =========================================================
       REPLAY
    ========================================================= */

    .replay-button {

      opacity: 0;

      margin-top: 20px;

      padding:
        10px
        16px;

      border:
        1px solid
        #ddd;

      background: white;

      border-radius: 20px;

      cursor: pointer;

      font-size: 11px;

      color: #777;

    }


    .replay-button.show {

      opacity: 1;

      transition:
        opacity
        0.5s
        ease;

    }



    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      position: absolute;

      bottom: 26px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 5;

      width: 100%;

      text-align: center;

      font-size: 10px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color:
        rgba(
          23,
          35,
          62,
          0.58
        );

    }



    /* =========================================================
       ANIMATION KEYFRAMES
    ========================================================= */

    @keyframes fadeUp {

      from {

        opacity: 0;

        transform:
          translateY(12px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes pulse {

      0%,
      100% {

        transform:
          scale(0.9);

        opacity: 0.4;

      }

      50% {

        transform:
          scale(1.05);

        opacity: 1;

      }

    }


    @keyframes load {

      from {
        width: 0%;
      }

      to {
        width: 100%;
      }

    }


    @keyframes popBounce {

      0% {

        opacity: 0;

        transform:
          scale(0.5)
          translateY(20px);

      }

      60% {

        opacity: 1;

        transform:
          scale(1.12)
          translateY(-6px);

      }

      100% {

        opacity: 1;

        transform:
          scale(1)
          translateY(0);

      }

    }


    @keyframes dance {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(-1deg);

      }

      50% {

        transform:
          translateY(-8px)
          rotate(1deg);

      }

    }


    @keyframes arrowAppear {

      from {

        opacity: 0;

        transform:
          translateX(-10px);

      }

      to {

        opacity: 1;

        transform:
          translateX(0);

      }

    }


    @keyframes finalReveal {

      0% {

        opacity: 0;

        transform:
          scale(0.8);

      }

      70% {

        opacity: 1;

        transform:
          scale(1.08);

      }

      100% {

        opacity: 1;

        transform:
          scale(1);

      }

    }



    /* =========================================================
       MOBILE
    ========================================================= */

    @media
    (
      max-width: 650px
    ) {

      .panel {

        padding:
          35px
          22px;

      }


      .options.moods {

        grid-template-columns:
          repeat(
            2,
            1fr
          );

      }


      .journey-network {

        gap: 3px;

      }


      .network-circle {

        width: 68px;
        height: 68px;

      }


      .network-number {

        font-size: 21px;

      }


      .network-arrow {

        font-size: 15px;

      }


      .network-label {

        font-size: 8px;

      }

    }

  </style>

</head>



<body>


  <div class="screen">


    <div class="background-circle-one"></div>

    <div class="background-circle-two"></div>



    <!-- BRAND -->

    <div class="brand">

      <div class="voco">
        voco
      </div>

      <div class="by-ihg">
        by IHG
      </div>

    </div>



    <!-- MAIN CONTENT -->

    <main
      class="panel"
      id="panel"
    >
    </main>



    <!-- OPTIONAL MUSIC -->

    <audio
      id="musicPlayer"
      src="music.mp3"
      preload="auto"
    ></audio>



    <!-- FOOTER -->

    <div class="footer">
      Your Nha Trang · voco Scenia Bay
    </div>


  </div>



  <script>


    /* =========================================================
       ANSWERS
    ========================================================= */

    const answers = {

      mood: "",

      companion: "",

      length: "",

      priorities: []

    };


    const panel =
      document.getElementById(
        "panel"
      );


    const musicPlayer =
      document.getElementById(
        "musicPlayer"
      );



    /* =========================================================
       PROGRESS
    ========================================================= */

    function progress(current) {

      let html =
        '<div class="progress">';


      for (
        let i = 1;
        i <= 4;
        i++
      ) {

        html += `

          <div
            class="
              progress-dot
              ${i === current ? "active" : ""}
            "
          ></div>

        `;

      }


      html +=
        '</div>';


      return html;

    }



    /* =========================================================
       OPTION TEMPLATE
    ========================================================= */

    function option(
      name,
      icon
    ) {

      return `

        <button
          class="option-button"
          data-value="${name}"
        >

          <div class="option-icon">
            ${icon}
          </div>

          <div class="option-label">
            ${name}
          </div>

        </button>

      `;

    }



    /* =========================================================
       SCREEN 1 — MOOD
    ========================================================= */

    function showMood() {

      panel.innerHTML = `

        ${progress(1)}

        <div class="eyebrow">
          Your Nha Trang
        </div>

        <h1 class="title">
          Choose your travel mood
        </h1>

        <p class="subtitle">
          Tell us how you want Nha Trang to feel.
        </p>

        <div class="options moods">

          ${option("Romance", "❤️")}

          ${option("Relaxation", "🌿")}

          ${option("Food", "🍜")}

          ${option("Adventure", "🏄")}

          ${option("Culture", "🏮")}

        </div>

        <button
          class="next-button"
          id="moodNext"
        >
          CONTINUE →
        </button>

      `;


      setupSingleSelection(
        "mood",
        "moodNext",
        showCompanion
      );

    }



    /* =========================================================
       SCREEN 2 — COMPANION
    ========================================================= */

    function showCompanion() {

      panel.innerHTML = `

        ${progress(2)}

        <div class="eyebrow">
          Personalise your journey
        </div>

        <h1 class="title">
          Who are you travelling with?
        </h1>

        <p class="subtitle">
          We'll shape your Nha Trang story around your trip.
        </p>

        <div class="options">

          ${option("Solo", "🧳")}

          ${option("Partner", "💛")}

          ${option("Friends", "👯")}

          ${option("Family", "👨‍👩‍👧")}

        </div>

        <button
          class="next-button"
          id="companionNext"
        >
          CONTINUE →
        </button>

      `;


      setupSingleSelection(
        "companion",
        "companionNext",
        showLength
      );

    }



    /* =========================================================
       SCREEN 3 — LENGTH
    ========================================================= */

    function showLength() {

      panel.innerHTML = `

        ${progress(3)}

        <div class="eyebrow">
          Personalise your journey
        </div>

        <h1 class="title">
          How long is your trip?
        </h1>

        <p class="subtitle">
          Choose the length of your Nha Trang escape.
        </p>

        <div class="options">

          ${option("2 days", "02")}

          ${option("3 days", "03")}

          ${option("4 days", "04")}

          ${option("5+ days", "05+")}

        </div>

        <button
          class="next-button"
          id="lengthNext"
        >
          CONTINUE →
        </button>

      `;


      setupSingleSelection(
        "length",
        "lengthNext",
        showPriorities
      );

    }



    /* =========================================================
       SCREEN 4 — PRIORITIES
    ========================================================= */

    function showPriorities() {

      answers.priorities = [];


      panel.innerHTML = `

        ${progress(4)}

        <div class="eyebrow">
          One last thing
        </div>

        <h1 class="title">
          What matters most?
        </h1>

        <p class="subtitle">
          Choose two experiences that should shape your story.
        </p>

        <div class="options">

          ${option("Calm", "🌊")}

          ${option("Local food", "🍜")}

          ${option("Nightlife", "✨")}

          ${option("Culture", "🏮")}

          ${option("Wellness", "🌿")}

          ${option("Exploration", "🗺️")}

        </div>

        <button
          class="next-button"
          id="priorityNext"
        >
          CREATE MY NHA TRANG ✦
        </button>

      `;


      const buttons =
        panel.querySelectorAll(
          ".option-button"
        );


      const next =
        document.getElementById(
          "priorityNext"
        );


      buttons.forEach(

        button => {

          button.addEventListener(

            "click",

            () => {


              const value =
                button.dataset.value;


              if (
                button.classList.contains(
                  "selected"
                )
              ) {

                button.classList.remove(
                  "selected"
                );


                answers.priorities =
                  answers.priorities.filter(

                    item =>
                      item !== value

                  );

              }


              else {

                if (
                  answers.priorities.length >= 2
                ) {

                  return;

                }


                button.classList.add(
                  "selected"
                );


                answers.priorities.push(
                  value
                );

              }


              if (
                answers.priorities.length === 2
              ) {

                next.classList.add(
                  "enabled"
                );

              }


              else {

                next.classList.remove(
                  "enabled"
                );

              }

            }

          );

        }

      );


      next.addEventListener(
        "click",
        showAI
      );

    }



    /* =========================================================
       SINGLE SELECTION
    ========================================================= */

    function setupSingleSelection(
      answerKey,
      nextID,
      nextScreen
    ) {

      const buttons =
        panel.querySelectorAll(
          ".option-button"
        );


      const next =
        document.getElementById(
          nextID
        );


      buttons.forEach(

        button => {

          button.addEventListener(

            "click",

            () => {


              buttons.forEach(

                b =>
                  b.classList.remove(
                    "selected"
                  )

              );


              button.classList.add(
                "selected"
              );


              answers[
                answerKey
              ] =
                button.dataset.value;


              next.classList.add(
                "enabled"
              );

            }

          );

        }

      );


      next.addEventListener(
        "click",
        nextScreen
      );

    }
